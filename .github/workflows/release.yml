name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish as a release (e.g. v0.1.0). Leave empty for a plain build.
        required: false

permissions:
  contents: write
  id-token: write # npm Trusted Publishing (OIDC)

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set server version from tag
        if: env.TAG != ''
        run: pnpm --filter tabmcp exec npm pkg set "version=${TAG#v}"

      - name: Build
        # A tag build is the "release" channel: its manifest version comes from
        # the tag, and its popup offers newer releases. Other builds are "dev".
        env:
          BROWSER_MCP_VERSION: ${{ env.TAG }}
        run: pnpm build

      - name: Zip extension
        run: |
          VERSION="${TAG:-$(git rev-parse --short HEAD)}"
          mkdir -p out
          (cd extension/dist && zip -qr "$GITHUB_WORKSPACE/out/browser-mcp-extension-${VERSION}.zip" .)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: browser-mcp-extension
          path: extension/dist
          if-no-files-found: error

      - name: Publish GitHub release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" out/*.zip -R "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" out/*.zip -R "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag
          fi

      # npm Trusted Publishing: npm checks this workflow's GitHub OIDC identity
      # against the trusted publisher configured on npmjs.com for "tabmcp". No
      # token or secret is involved, and provenance is attached automatically.
      - name: Publish server to npm
        if: env.TAG != ''
        run: |
          VERSION="${TAG#v}"
          if npm view "tabmcp@$VERSION" version >/dev/null 2>&1; then
            echo "tabmcp@$VERSION is already on npm."
            exit 0
          fi
          npm install -g npm@^11.5.1   # Trusted Publishing needs npm 11.5.1+
          # pnpm pack rewrites workspace: ranges; npm publish does the OIDC exchange.
          (cd server && pnpm pack --pack-destination "$RUNNER_TEMP")
          npm publish "$RUNNER_TEMP/tabmcp-$VERSION.tgz" --access public
